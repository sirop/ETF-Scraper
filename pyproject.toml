[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etf_scraper"
version = "0.1.2"
description = "Scrape ETF and Mutual Fund holdings from major providers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
    "tenacity",
    "pandas>=2.2",
    "numpy",
    "pandas_market_calendars",
    "openpyxl",
]

[project.optional-dependencies]
cloud = [
    "gcsfs",
    # FIXME: fastparquet<=2023.01 doesn't work with numpy 2; revisit (pyarrow?)
    # once the archive cloud is chosen
    "fastparquet<=2023.01",
    "google-cloud-bigquery",
]
tests = [
    "pytest",
]

[project.urls]
Home = "https://github.com/nikulpatel3141/ETF-Scraper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etf_scraper.data" = ["*.csv"]
