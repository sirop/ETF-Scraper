[build-system]
requires = ["setuptools>=63.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etf_scraper"
version = "0.1.2"
description = "Scrape ETF and Mutual Fund holdings from major providers"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "requests",
    "tenacity",
    "pandas>=2.2",
    "numpy<2.0",
    # 5.x uses Python 3.10+ syntax but doesn't declare it, so pip installs it on 3.9
    "pandas_market_calendars<5; python_version < '3.10'",
    "pandas_market_calendars; python_version >= '3.10'",
    "openpyxl",
]

[project.optional-dependencies]
cloud = [
    "gcsfs",
    "fastparquet<=2023.01",
    "google-cloud-bigquery",
]
tests = [
    "pytest",
]

[project.urls]
Home = "https://github.com/nikulpatel3141/ETF-Scraper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etf_scraper.data" = ["*.csv"]
