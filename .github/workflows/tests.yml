name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (3.10, gets pandas 2.x) and newest (3.15, gets pandas 3.x)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[tests]"
      - name: Run tests
        run: python -m pytest test -q
