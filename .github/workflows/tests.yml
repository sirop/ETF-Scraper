name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9/3.10 get pandas 2.x, 3.11+ gets pandas 3.x.
          # ubuntu-latest no longer provides Python 3.9 (end of life Oct 2025),
          # so 3.9 is only tested on Windows.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[tests]"
      - name: Run tests
        run: python -m pytest test -q
