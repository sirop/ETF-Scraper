<li><strong>Does it promote sustainability characteristics?</strong></li></ul><p>The Fund promotes a range of environmental and social characteristics which are met by tracking the Index. Further information on how such characteristics are met by the Fund can be found in the Fund Supplement.</p>\n<p></p>\n    \n","partId":12407},"key":"fundSnapshot","title":"Fund snapshot"},"fundFacts":{"part":{"etfFundSize":{"part":{"type":"Prices","data":{"4516":["$1807.7m"]},"headers":["Fund size"],"conf":{},"note":"(6 Nov 2026)","partId":12417},"key":"etfFundSize","title":"Fund size"},"baseCurrency":{"part":{"type":"DataTable","data":[["Base currency","USD"]],"headers":null,"conf":{},"note":"","partId":12381,"asAtDate":"2026-09-30"},"key":"baseCurrency","title":"Currency"},"launchDate":{"key":"launchDate","title":"Fund launch date","useFundData":"fundLaunchDate","order":"0"},"shareClassLaunch":{"key":"shareClassLaunch","title":"Share class launch","useShareclassData":"launchDate","order":"1"},"domicile":{"part":{"type":"DataTable","data":[["Domicile","Ireland"]],"headers":null,"conf":{},"note":"","partId":12383,"asAtDate":"2026-09-30"},"key":"domicile","title":"Domicile","order":"2"},"replicationMethod":{"part":{"type":"DataTable","data":[["Replication method","Physical - full replication"]],"headers":null,"conf":{},"note":"","partId":12416,"asAtDate":"2026-09-30"},"key":"replicationMethod","title":"Replication method"}},"key":"fundFacts","title":"Fund facts"},"benchmark":{"part":{"benchmark":{"part":{"type":"Text","data":"<p>ROBO Global® Artificial Intelligence Index TR</p>","partId":12401},"key":"benchmark","title":"Benchmark"}},"key":"benchmark","title":"Benchmark"}},"key":"canvas"}},{"key":"index","title":"Index description","data":12624,"canvas":{"part":{"commentary":{"part":{"type":"Text","data":"\n    \n        <p data-part-id=\"12625\">\n</p><p>The Index aims to track the performance of a basket of companies that have a distinct portion of their business and revenue derived from the field of Artificial Intelligence, and the potential to grow within this space through innovation and/or market adoption of their products and/or services.</p><p>The index is comprised of companies which are publicly traded on various stock exchanges around the world that are exposed to the \"Artificial Intelligence\" theme as defined by ROBO Global®. ROBO Global® created and maintains a unique database of companies across the globe that have a portion of their business and revenue associated with Artificial Intelligence and enabling technologies. The ROBO Global® Industry Classification currently identifies 11 subsectors of the Artificial Intelligence theme that present a suitable level of product and technology maturity to carry high growth and returns potential.</p><p>A company is only eligible for inclusion in the Index if it is of a sufficient size (determined by reference to the total market value of its shares) and it is sufficiently \"liquid\" ( a measure of how actively its shares are traded on a daily basis). Within the Index, companies are weighted according a modified AI-factor weighting scheme. The Index is rebalanced quarterly in March, June, September and December.</p>\n<p></p>\n    \n","partId":12625},"key":"commentary"},"indexTable":{"part":{"type":"DataTable","data":[["Provider","ROBO Global®"],["Bloomberg code","THNQTR"],["Reuters code",".THNQTR"],["Type","Total Return"],["Website","https://www.roboglobal.com/robo-global-indices/thnq-index/"]],"headers":null,"conf":{"headerPhrase":848},"note":"","title":"Index data","partId":12626,"asAtDate":"2026-09-30"},"key":"indexTable","title":"Index data"}},"key":"canvas"}},{"key":"performance","title":"Performance","data":12616,"canvas":{"part":{"disclaimer":{"part":{"type":"AdvancedHTML","data":{"4516":{"firstParagraph":"Performance for the USD Accumulating unit class in USD, launched on 02 July 2019. Source: Lipper. Performance assumes all ETF charges have been taken and that all income genera act; and</li><li>Avoiding the financing of controversial weapons.</li></ul>\n<p></p>\n    \n","partId":12450},"key":"text","title":"Text"}},"key":"socialCharacteristics","title":"Social characteristics"},"environmentalAndSocialCharacteristicsOutro":{"part":{"outro":{"part":{"type":"Text","data":"\n    \n        <p data-part-id=\"12451\">\n</p><p>The Fund promotes the above-mentioned characteristics by tracking the ROBO Global Artificial Intelligence Index TR (the “Index”), which is a designated reference benchmark for the purpose of attaining the environmental and social characteristics promoted by the Fund. Whilst environmental and social characteristics are promoted through the application of the sustainability-related investment strategy, investors are reminded that these environmental and social characteristics are not sustainable investment objectives.</p>\n<p></p>\n    \n","partId":12451},"key":"outro","title":"Outro"}},"key":"environmentalAndSocialCharacteristicsOutro","title":"Environmental and social characteristics outro"}},"key":"environmentalAndSocialCharacteristics","title":"Environmental and social characteristics"},"esgInvestmentStrategy":{"part":{"esgInvestmentStrategyIntro":{"part":{"intro":{"part":{"type":"Text","data":"\n    \n        <p data-part-id=\"12452\">\n</p><p>The Fund follows the following sustainability-related investment strategy by tracking the Index that applies:</p>\n<p></p>\n    \n","partId":12452},"key":"intro","title":"Intro"}},"key":"esgInvestmentStrategyIntro","title":"ESG investment strategy intro"},"action":{"part":{"header":{"part":{"data":{"title":"Action","image":"/static//images/LGIM_icons_green_RGB_communication_Tick_choice.svg","links":[]},"conf":{},"partId":17080},"key":"header","title":"Header"}},"key":"action","title":"Action"},"batteryValueChainTheme":{"part":{"header":{"part":{"data":{"title":"Battery Value-Chain Theme","image":"/static//images/Online_Icon_24_Green.svg","links":[]},"conf":{},"partId":12492},"key":" ful activities such as weapons and arms, tobacco, thermal coal-related activities, unconventional and conventional oil and gas-related activities, power generation and animal testing, and iv) economic activities contributing to the theme.</p><p>The Index Provider evaluates ESG factors using a combination of internal research, regular interaction with index member companies, as well as support from leading ESG research providers to ensure they comply with all aspects of the ROBO Global ESG Policy. The data used to construct the index is sourced from external data providers.</p><p>Further information can be found on the ROBO Global® LLC website at: <a href=\"https://www.roboglobal.com/esg-policy/\" data-mce-href=\"https://www.roboglobal.com/esg-policy/\">https://www.roboglobal.com/esg-policy/</a></p>\n<p></p>\n    \n","partId":12483},"key":"text","title":"Text"}},"key":"roboGlobalESGPolicy","title":"ROBO Global ESG Policy"},"solactiveESGExclusions":{"part":{"header":{"part":{"data":{"title":"Solactive ESG Exclusions","image":"/static//images/Hazards_Icon_04_Mono_Green.svg","links":[]},"conf":{},"partId":12523},"key":"header","title":"Header"}},"key":"solactiveESGExclusions","title":"Solactive ESG Exclusions"},"solactiveESGEnhancedExclusions":{"part":{"header":{"part":{"data":{"title":"Solactive ESG Enhanced Exclusions","image":"/static//images/Hazards_Icon_04_Mono_Green.svg","links":[]},"conf":{},"partId":12524},"key":"header","title":"Header"}},"key":"solactiveESGEnhancedExclusions","title":"Solactive ESG Enhanced Exclusions"},"nasdaqESGExclusions":{"part":{"header":{"part":{"data":{"title":"Nasdaq ESG Exclusions","image":"/static//images/Hazards_Icon_04_Mono_Green.svg","links":[]},"conf":{},"partId":12525},"key":"header","title":"Header"}},"key":"nasdaqESGExclusions","title":"Nasdaq ESG Exclusions"},"stoxxExclusions":{"part":{"header":{"part":{"data":{"title":"Stoxx Exclusions","image":"/static//images/Hazards_Icon_04_Mono_Green.svg","links":[]},"conf":{},"partId":1
